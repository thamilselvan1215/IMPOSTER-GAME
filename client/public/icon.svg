<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0a0518" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#7c3aed" stroke-width="12" />

  <!-- Inner Glow Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.6" />

  <!-- Headphones Band -->
  <path d="M 120 260 A 140 140 0 0 1 392 260" fill="none" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round" filter="url(#glow)" />

  <!-- Headphone Earcups -->
  <rect x="96" y="240" width="36" height="70" rx="18" fill="#7c3aed" />
  <rect x="380" y="240" width="36" height="70" rx="18" fill="#ef4444" />

  <!-- Music Note Symbol in Center -->
  <path d="M 245 160 L 315 140 V 270 A 35 35 0 1 1 245 235 L 245 160 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
  <circle cx="220" cy="270" r="35" fill="url(#primaryGrad)" filter="url(#glow)" />
</svg>
